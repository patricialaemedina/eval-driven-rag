[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-rag"
version = "0.1.0"
description = "An evaluation-first, citation-grounded retrieval assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]
llm = [
  "openai>=2.0",
  "pydantic>=2.10",
]
api = [
  "fastapi>=0.115",
  "openai>=2.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.8",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
evidence-rag = "evidence_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_rag"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
